function render(lang){
  currentLang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[lang][key]!==undefined) el.textContent = dict[lang][key];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const key = el.getAttribute("data-i18n-html");
    if(dict[lang][key]!==undefined) el.innerHTML = dict[lang][key];
  });

  const chipGrid = document.getElementById("chip-grid");
  chipGrid.innerHTML = "";
  skills[lang].forEach(s=>{
    const d = document.createElement("div");
    d.className = "chip";
    d.textContent = s;
    chipGrid.appendChild(d);
  });

  const tl = document.getElementById("timeline");
  tl.innerHTML = "";
  timeline[lang].forEach(item=>{
    const d = document.createElement("div");
    d.className = "t-item";
    d.innerHTML = `<div class="yr">${item.yr}</div><h3>${item.t}</h3><p>${item.d}</p>`;
    tl.appendChild(d);
  });

  renderFilterBar(lang);
  renderWork(lang, currentFilter);
}

function renderFilterBar(lang){
  const bar = document.getElementById("filter-bar");
  bar.innerHTML = "";
  const groups = ["all", ...Object.keys(groupLabels[lang])];
  groups.forEach(g=>{
    const b = document.createElement("button");
    b.className = "filter-btn" + (g===currentFilter ? " active" : "");
    b.textContent = g==="all" ? dict[lang]["filter-all"] : groupLabels[lang][g];
    b.onclick = ()=>{ currentFilter = g; renderFilterBar(lang); renderWork(lang, g); };
    bar.appendChild(b);
  });
}

function renderWork(lang, filter){
  const wg = document.getElementById("work-grid");
  wg.innerHTML = "";
  const items = work[lang].filter(w => filter==="all" || w.group===filter);
  lightboxItems = items;
  items.forEach((w, idx)=>{
    const d = document.createElement("div");
    d.className = "work-card";
    d.onclick = ()=> openLightbox(idx);
    d.innerHTML = `<div class="work-thumb"><img src="${w.img}" alt="${w.t}" loading="lazy"><span class="crop tl"></span><span class="crop br"></span></div>
    <div class="work-info"><div class="cat">${w.cat}</div><h4>${w.t}</h4></div>`;
    wg.appendChild(d);
  });
}

function openLightbox(idx){
  lightboxIndex = idx;
  updateLightbox();
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){ document.getElementById("lightbox").classList.remove("open"); }
function navLightbox(dir){
  lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
  updateLightbox();
}
function updateLightbox(){
  const item = lightboxItems[lightboxIndex];
  if(!item) return;
  document.getElementById("lightbox-img").src = item.img;
  document.getElementById("lightbox-img").alt = item.t;
  document.getElementById("lightbox-caption").textContent = item.cat + " — " + item.t;
}
document.getElementById("lightbox").addEventListener("click", (e)=>{
  if(e.target.id==="lightbox") closeLightbox();
});

function setLang(lang){
  const html = document.getElementById("html-root");
  html.setAttribute("lang", lang);
  html.setAttribute("dir", lang==="ar" ? "rtl" : "ltr");
  html.setAttribute("data-lang", lang);
  document.getElementById("btn-fr").classList.toggle("active", lang==="fr");
  document.getElementById("btn-ar").classList.toggle("active", lang==="ar");
  currentFilter = "all";
  render(lang);
}

function toggleTheme(){
  const html = document.getElementById("html-root");
  const isDark = html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
}

function animateCounters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const target = parseInt(el.getAttribute("data-count"), 10);
    const duration = 900;
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const value = Math.floor(progress * target);
      el.textContent = value;
      if(progress < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  });
}

setLang("fr");
animateCounters();
</script>
</body>
</html>
