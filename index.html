<style>
  :root{
    --paper:#F0EDE3;
    --paper-shadow:#DCD7C6;
    --ink:#17181B;
    --cyan:#00AEEF;
    --magenta:#EC0868;
    --yellow:#FFD400;
    --line:#C9C5B4;
    --max:1040px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  html[data-lang="ar"] body{
    font-family:'IBM Plex Sans Arabic','IBM Plex Sans', sans-serif;
  }

  .display{
    font-family:'Anton', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:0.92;
  }
  html[data-lang="ar"] .display{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    letter-spacing:0;
    text-transform:none;
  }

  .mono{ font-family:'IBM Plex Mono', monospace; }
  html[data-lang="ar"] .mono{ font-family:'IBM Plex Sans Arabic', sans-serif; }

  /* ---------- registration crosshairs (signature element) ---------- */
  .reg-mark{
    position:fixed;
    width:22px; height:22px;
    z-index:40;
    opacity:0.55;
    pointer-events:none;
  }
  .reg-mark svg{width:100%; height:100%;}
  .reg-tl{top:14px; left:14px;}
  .reg-tr{top:14px; right:14px;}
  .reg-bl{bottom:14px; left:14px;}
  .reg-br{bottom:14px; right:14px;}
  @media (max-width:640px){ .reg-mark{width:16px; height:16px;} }

  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(240,237,227,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--max); margin:0 auto;
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand-mark{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.08em;
  }
  .brand-dot{width:8px; height:8px; border-radius:50%; background:var(--magenta);}

  .lang-toggle{
    display:flex; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.04em;
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--ink);
    padding:7px 14px; cursor:pointer; font:inherit;
  }
  .lang-toggle button.active{ background:var(--ink); color:var(--paper); }

  /* ---------- color bar divider (signature element) ---------- */
  .colorbar{
    display:flex; height:10px; width:100%;
  }
  .colorbar span{ flex:1; }
  .cb-paper{background:var(--paper-shadow);}
  .cb-c{background:var(--cyan);}
  .cb-m{background:var(--magenta);}
  .cb-y{background:var(--yellow);}
  .cb-k{background:var(--ink);}

  section{ max-width:var(--max); margin:0 auto; padding:64px 24px; position:relative;}
  @media (max-width:640px){ section{ padding:44px 20px; } }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--magenta);
    display:flex; align-items:center; gap:8px;
    margin-bottom:14px;
  }
  html[data-lang="ar"] .eyebrow{ font-family:'IBM Plex Sans Arabic'; letter-spacing:0; }
  .eyebrow::before{ content:""; width:20px; height:1.5px; background:var(--magenta); }

  /* ---------- hero ---------- */
  .hero{ padding-top:88px; padding-bottom:56px; }
  .hero h1{
    font-size:clamp(48px, 11vw, 108px);
    color:var(--ink);
  }
  .hero h1 .accent{ color:var(--magenta); }
  .hero .role{
    margin-top:18px;
    font-size:clamp(16px,3vw,20px);
    max-width:520px;
    color:#3a3a3a;
  }
  .hero .tag{
    margin-top:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#6b6858;
  }
  html[data-lang="ar"] .hero .tag{ font-family:'IBM Plex Sans Arabic'; }

  .hero-actions{ margin-top:32px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.03em;
    padding:13px 22px; border-radius:2px; text-decoration:none; cursor:pointer;
    display:inline-block; border:1.5px solid var(--ink); transition:transform .15s ease;
  }
  html[data-lang="ar"] .btn{ font-family:'IBM Plex Sans Arabic'; }
  .btn:hover{ transform:translateY(-2px); }
  .btn-solid{ background:var(--ink); color:var(--paper); }
  .btn-outline{ background:transparent; color:var(--ink); }

  /* ---------- swatch strip under hero ---------- */
  .swatch-strip{ display:flex; gap:0; margin-top:52px; border:1px solid var(--line); }
  .swatch{ flex:1; padding:14px 10px; border-inline-start:1px solid var(--line); text-align:center; }
  .swatch:first-child{ border-inline-start:none; }
  .swatch .n{ font-family:'Anton', sans-serif; font-size:22px; }
  html[data-lang="ar"] .swatch .n{ font-family:'Cairo', sans-serif; font-weight:800;}
  .swatch .l{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#6b6858; margin-top:4px;}
  html[data-lang="ar"] .swatch .l{ font-family:'IBM Plex Sans Arabic'; letter-spacing:0;}
  @media (max-width:640px){ .swatch-strip{ flex-wrap:wrap; } .swatch{ flex:1 1 50%; border-bottom:1px solid var(--line);} }

  /* ---------- about ---------- */
  .about-grid{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:start; }
  @media (max-width:760px){ .about-grid{ grid-template-columns:1fr; } }
  .about-text p{ font-size:16px; line-height:1.75; color:#2c2c2c; margin-bottom:14px; }
  .about-text p:last-child{ margin-bottom:0; }

  .info-card{
    border:1px solid var(--line); background:#fff; padding:22px;
  }
  .info-card .row{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .info-card .row:last-child{ border-bottom:none; }
  .info-card .row .k{ color:#6b6858; font-family:'IBM Plex Mono',monospace; }
  html[data-lang="ar"] .info-card .row .k{ font-family:'IBM Plex Sans Arabic'; }
  .info-card .row .v{ font-weight:600; text-align:right; }
  html[data-lang="ar"] .info-card .row .v{ text-align:left; }

  h2.section-title{
    font-size:clamp(30px,5vw,44px);
    margin-bottom:28px;
  }

  /* ---------- skills ---------- */
  .chip-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{
    border:1.5px solid var(--ink); padding:10px 16px; font-size:13px;
    font-family:'IBM Plex Mono', monospace; position:relative;
  }
  html[data-lang="ar"] .chip{ font-family:'IBM Plex Sans Arabic'; }
  .chip::before{ content:"+ "; color:var(--magenta); }

  /* ---------- timeline ---------- */
  .timeline{ border-inline-start:2px solid var(--ink); padding-inline-start:26px; display:flex; flex-direction:column; gap:34px; }
  .t-item{ position:relative; }
  .t-item::before{
    content:""; position:absolute; inset-inline-start:-33px; top:4px;
    width:12px; height:12px; background:var(--yellow); border:2px solid var(--ink); border-radius:50%;
  }
  .t-item .yr{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--magenta); letter-spacing:0.05em; }
  html[data-lang="ar"] .t-item .yr{ font-family:'IBM Plex Sans Arabic'; }
  .t-item h3{ font-size:19px; margin-top:4px; font-weight:600; }
  .t-item p{ font-size:14.5px; color:#3a3a3a; margin-top:6px; line-height:1.6; max-width:560px; }

  /* ---------- work gallery ---------- */
  .work-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; }
  @media (max-width:640px){ .work-grid{ grid-template-columns:1fr; } }
  .work-card{
    border:1px solid var(--line); background:#fff; overflow:hidden;
  }
  .work-thumb{
    height:190px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink);
  }
  .work-thumb img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:grayscale(15%) contrast(1.04);
    transition:transform .35s ease, filter .35s ease;
  }
  .work-card:hover .work-thumb img{ transform:scale(1.05); filter:grayscale(0%) contrast(1.04); }
  .work-thumb .crop{ position:absolute; width:14px; height:14px; z-index:2; }
  .work-thumb .crop.tl{top:8px; left:8px; border-top:2px solid rgba(255,255,255,0.75); border-left:2px solid rgba(255,255,255,0.75);}
  .work-thumb .crop.br{bottom:8px; right:8px; border-bottom:2px solid rgba(255,255,255,0.75); border-right:2px solid rgba(255,255,255,0.75);}
  .work-info{ padding:16px 18px; border-top:1px solid var(--line); }
  .work-info .cat{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--magenta); }
  html[data-lang="ar"] .work-info .cat{ font-family:'IBM Plex Sans Arabic'; letter-spacing:0; }
  .work-info h4{ font-size:15.5px; margin-top:4px; font-weight:600; }

  .note-box{
    margin-top:22px; border:1px dashed var(--line); padding:16px 18px; font-size:13px; color:#6b6858;
    font-family:'IBM Plex Mono', monospace; line-height:1.6;
  }
  html[data-lang="ar"] .note-box{ font-family:'IBM Plex Sans Arabic'; }

  /* ---------- contact ---------- */
  .contact-box{
    border:1.5px solid var(--ink); padding:38px 30px; display:flex; flex-direction:column; gap:18px;
  }
  .contact-box h2{ font-size:clamp(26px,5vw,38px); }
  .contact-links{ display:flex; flex-wrap:wrap; gap:14px; }

  footer{
    text-align:center; padding:28px 20px 40px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:#6b6858; letter-spacing:0.04em;
  }
  html[data-lang="ar"] footer{ font-family:'IBM Plex Sans Arabic'; letter-spacing:0; }

  ::selection{ background:var(--yellow); color:var(--ink); }
  a{ color:inherit; }
  button:focus-visible, a:focus-visible{ outline:2px solid var(--magenta); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>

function render(lang){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[lang][key]!==undefined) el.textContent = dict[lang][key];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const key = el.getAttribute("data-i18n-html");
    if(dict[lang][key]!==undefined) el.innerHTML = dict[lang][key];
  });

  const chipGrid = document.getElementById("chip-grid");
  chipGrid.innerHTML = "";
  skills[lang].forEach(s=>{
    const d = document.createElement("div");
    d.className = "chip";
    d.textContent = s;
    chipGrid.appendChild(d);
  });

  const tl = document.getElementById("timeline");
  tl.innerHTML = "";
  timeline[lang].forEach(item=>{
    const d = document.createElement("div");
    d.className = "t-item";
    d.innerHTML = `<div class="yr">${item.yr}</div><h3>${item.t}</h3><p>${item.d}</p>`;
    tl.appendChild(d);
  });

  const wg = document.getElementById("work-grid");
  wg.innerHTML = "";
  work[lang].forEach(w=>{
    const d = document.createElement("div");
    d.className = "work-card";
    d.innerHTML = `<div class="work-thumb"><img src="${w.img}" alt="${w.t}" loading="lazy"><span class="crop tl"></span><span class="crop br"></span></div>
    <div class="work-info"><div class="cat">${w.cat}</div><h4>${w.t}</h4></div>`;
    wg.appendChild(d);
  });
}

function setLang(lang){
  const html = document.getElementById("html-root");
  html.setAttribute("lang", lang);
  html.setAttribute("dir", lang==="ar" ? "rtl" : "ltr");
  html.setAttribute("data-lang", lang);
  document.getElementById("btn-fr").classList.toggle("active", lang==="fr");
  document.getElementById("btn-ar").classList.toggle("active", lang==="ar");
  render(lang);
  localStorage_safe(lang);
}
function localStorage_safe(lang){ /* no-op: browser storage not used in this static file */ }
